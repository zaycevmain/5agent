# Reverse-proxy для 5agent — только HTTPS (443).
# Положи в /etc/nginx/sites-available/5agent и сделай symlink в sites-enabled.
#
# ВАЖНО: не указывай nginx на server/static/index.html напрямую —
# дашборд ходит к API (/api/state и т.д.), которое отдаёт FastAPI.
# Поэтому проксируем ВСЁ на приложение на :8080.

# --- HTTP -> HTTPS (редирект) ---
server {
    listen 80;
    listen [::]:80;
    server_name monitoring.example.com;   # твой домен

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name monitoring.example.com;   # твой домен

    # Пути certbot (замени на свой домен). Если сертификаты свои — укажи их пути.
    ssl_certificate     /etc/letsencrypt/live/monitoring.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitoring.example.com/privkey.pem;

    # Современные TLS-настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Пароль на дашборд (Basic Auth) ---
    # Создай файл паролей один раз:
    #   sudo htpasswd -c /etc/nginx/.htpasswd admin
    # (htpasswd входит в apache2-utils / httpd-tools)

    # Агенты пушат heartbeat БЕЗ пароля — этот путь оставляем открытым.
    location = /api/heartbeat {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Всё остальное (дашборд + админ-API) — за паролем.
    location / {
        auth_basic "5agent";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # nginx на той же машине:
        proxy_pass http://127.0.0.1:8080;
        # nginx на другой машине — укажи IP сервера с 5agent:
        # proxy_pass http://10.0.0.10:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
